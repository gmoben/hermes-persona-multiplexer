[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-persona-multiplexer"
version = "0.4.1"
description = "One Hermes brain, many Discord faces — a multi-account Discord platform plugin for Hermes Agent."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "gmoben", email = "ben@warr.io" }]
requires-python = ">=3.11"
keywords = ["hermes-agent", "discord", "ai-agent", "plugin", "multi-agent", "persona"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

# Runtime dependencies (discord.py, Hermes Agent) are provided by the Hermes host
# environment; they are intentionally not hard-pinned here so the core remains
# installable/testable standalone.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/gmoben/hermes-persona-multiplexer"
Issues = "https://github.com/gmoben/hermes-persona-multiplexer/issues"

[tool.setuptools]
# Canonical Hermes flat plugin layout: Hermes loads the plugin *directory* as a
# package, so the importable code lives in top-level modules at the repo root
# (alongside a register() shim in __init__.py that only Hermes's dir-loader uses).
# Declare the modules explicitly so an editable install doesn't trip setuptools'
# flat-layout auto-discovery — which would otherwise also vacuum up conftest.py.
py-modules = ["routing", "locks", "adapter"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# importlib mode: import test modules by path without the rootdir package-walk,
# which otherwise trips on the plugin-root __init__.py (the shim Hermes loads).
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The plugin loads as a package (hermes_persona_multiplexer) and its modules are
# also importable top-level; treat both as first-party so test import blocks sort.
known-first-party = ["hermes_persona_multiplexer", "routing", "locks", "adapter"]
