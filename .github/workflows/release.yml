name: Release

# release-please owns the entire release flow: it derives the next SemVer from
# Conventional Commits, opens/maintains a release PR, and on merge it tags the
# release, creates the GitHub Release, updates CHANGELOG.md, and syncs the version
# into plugin.yaml / pyproject.toml / __init__.py (extra-files).
# See RELEASING.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
