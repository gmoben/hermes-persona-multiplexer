version: 2
updates:
  # Keep GitHub Actions (release-please, checkout, setup-python, ...) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci          # Conventional Commit prefix so release-please categorizes it

  # Dev tooling (pytest, ruff) declared in pyproject [project.optional-dependencies].
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
